name: Release

# Собирает готовые пакеты и публикует их в GitHub Release.
# Триггер: пуш тега вида v1.2.3 (тег должен совпадать с version в manifest.json).
# Ручной запуск (workflow_dispatch) только собирает/тестирует, без публикации релиза.
#
# Firefox: если в секретах репозитория заданы AMO_API_KEY и AMO_API_SECRET —
# новая версия загружается в публичный каталог AMO (listed-канал) на ревью Mozilla.
# Листинг создаётся один раз вручную — см. docs/amo-listing.md. Без секретов шаг
# AMO пропускается; в релиз всегда кладётся firefox-zip для временной установки.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tests (gate)
        run: npm test

      - name: Build chrome.zip and firefox.zip
        run: sh scripts/build.sh

      - name: Stage assets with unique names
        id: stage
        run: |
          ver=$(python -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          cp "dist/chrome/proxypilot-$ver.zip"  "release-assets/proxypilot-chrome-$ver.zip"
          cp "dist/firefox/proxypilot-$ver.zip" "release-assets/proxypilot-firefox-$ver.zip"

      - name: Publish Firefox version to AMO (listed) — needs AMO_API_KEY / AMO_API_SECRET
        if: ${{ env.AMO_API_KEY != '' && env.AMO_API_SECRET != '' }}
        run: |
          ver=${{ steps.stage.outputs.ver }}
          mkdir -p firefox-src
          (cd firefox-src && unzip -o "../dist/firefox/proxypilot-$ver.zip")
          # Uploads this version to the AMO *listed* (public catalog) channel for review.
          # The add-on listing (name, description, screenshots) must already exist on AMO
          # — see docs/amo-listing.md for the one-time setup. Listed versions are
          # distributed by AMO, so no signed .xpi is produced here. --approval-timeout 0
          # submits without blocking CI on Mozilla's review.
          npx --yes web-ext@latest sign \
            --source-dir firefox-src \
            --channel listed \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --approval-timeout 0 \
            || echo "::warning::AMO listed upload failed — confirm the listing exists and the API keys are valid (see docs/amo-listing.md)."

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ProxyPilot ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Установка

            **Chrome / Edge / Brave:** скачай `proxypilot-chrome-*.zip`, распакуй,
            открой `chrome://extensions` → включи «Режим разработчика» →
            «Загрузить распакованное» → выбери распакованную папку.

            **Firefox:** ставь из каталога [Firefox Add-ons](https://addons.mozilla.org/firefox/)
            (постоянная установка, авто-обновления — после одобрения версии Mozilla).
            Либо `proxypilot-firefox-*.zip` для временной установки:
            `about:debugging` → «Load Temporary Add-on».

            Подробности — [INSTALL.md](https://github.com/Aimagine-life/proxypilot/blob/main/INSTALL.md).
          files: |
            release-assets/proxypilot-chrome-*.zip
            release-assets/proxypilot-firefox-*.zip
